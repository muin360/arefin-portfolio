# Dependabot configuration for arefin-portfolio
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Dhaka"
    # Limit PR noise for a solo project
    open-pull-requests-limit: 5
    # Group minor and patch updates together to reduce PR count
    groups:
      # Group all non-major dependency updates together
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Apply standard labels for easy filtering
    labels:
      - dependencies
    # Only open security PRs for major versions
    ignore: []
    # Commit message prefix for easier filtering
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
